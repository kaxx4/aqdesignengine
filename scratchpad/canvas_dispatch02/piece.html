<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'BigShoulders';src:url('fonts/BigShoulders-Bold.ttf') format('truetype');font-weight:800}
@font-face{font-family:'JetBrainsMono';src:url('fonts/JetBrainsMono-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'JetBrainsMono';src:url('fonts/JetBrainsMono-Bold.ttf') format('truetype');font-weight:700}
@font-face{font-family:'InstrumentSerif';src:url('fonts/InstrumentSerif-Italic.ttf') format('truetype');font-style:italic}

:root{
  --cream:#F4EFE0;
  --ink:#0A0A0A;
  --tomato:#FF4D2E;
  --sky:#3DA9FC;
  --mint:#1B8A5A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2160px;height:2700px;background:var(--cream);overflow:hidden;position:relative;font-family:'JetBrainsMono',monospace}

#grain{position:absolute;inset:0;opacity:0.045;mix-blend-mode:multiply;pointer-events:none;z-index:50}
.frame{position:absolute;inset:64px;border:3px solid var(--ink);z-index:40}

/* ---- header : one quiet line, full width ---- */
.hdr{position:absolute;top:118px;left:130px;right:130px;display:flex;justify-content:space-between;
  font-size:19px;letter-spacing:0.22em;color:var(--ink)}
.hdr b{font-weight:700}
.hdr span{opacity:0.5}
.hdr-rule{position:absolute;top:158px;left:130px;right:130px;height:1.5px;background:var(--ink)}

/* ---- fine ruler bands : dense accumulation of marks ---- */
.fineruler{position:absolute;left:130px;right:130px;height:64px}
.fineruler .fl{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink);opacity:0.18}
.ft{position:absolute;top:50%;width:1px;background:var(--ink);opacity:0.22}

/* ---- giant numeral, top right, whole glyph shown at full scale ---- */
.num-wrap{position:absolute;top:300px;right:106px;text-align:right}
.numeral{font-family:'BigShoulders';font-weight:800;
  font-size:560px;line-height:0.78;color:var(--ink);letter-spacing:-0.02em}
.num-capline{position:absolute;top:758px;right:130px;width:220px;height:1.5px;background:var(--ink)}
.num-cap{position:absolute;top:786px;right:130px;text-align:right;font-size:16px;letter-spacing:0.2em;
  color:var(--ink);opacity:0.62;width:420px;line-height:1.6}

/* ---- the axis + door-swing diagram ---- */
.diagram{position:absolute;left:130px;right:130px;top:960px;height:660px}
svg.diag-svg{position:absolute;inset:0;overflow:visible}
.gtick{position:absolute;top:100%;transform:translate(-50%,26px);text-align:center;
  font-size:15px;color:var(--ink);white-space:nowrap}
.gtick .code{display:block;font-weight:700;letter-spacing:0.04em}
.gtick .deg{display:block;opacity:0.5;margin-top:5px;font-size:13px}

/* ---- annotation ---- */
.annot{position:absolute;left:130px;bottom:520px}
.annot-bar{width:300px;height:16px;background:var(--sky);margin-bottom:-18px}
.annot-serif{font-family:'InstrumentSerif';font-style:italic;font-size:104px;color:var(--ink);
  line-height:0.95;position:relative}

.readout{position:absolute;right:130px;bottom:500px;width:440px;font-size:16px;
  line-height:2.0;color:var(--ink)}
.readout-row{display:flex;justify-content:space-between;gap:24px}
.readout .lbl{opacity:0.5;letter-spacing:0.12em}
.readout .val{font-weight:700;letter-spacing:0.03em}
.readout-rule{width:100%;height:1px;background:var(--ink);opacity:0.25;margin:16px 0}

/* ---- footer ---- */
.ftr{position:absolute;left:130px;right:130px;bottom:150px}
.ftr-rule{height:1.5px;background:var(--ink);margin-bottom:24px}
.ftr-row{display:flex;justify-content:space-between;align-items:baseline;
  font-size:16px;letter-spacing:0.16em;color:var(--ink)}
.ftr-row .l{font-weight:700}
.ftr-row .r{opacity:0.55;letter-spacing:0.08em}

.ruler{position:absolute;left:130px;right:130px;bottom:112px;height:20px}
.rt{position:absolute;top:0;width:1px;height:8px;background:var(--ink);opacity:0.32}
.rt.major{height:14px;opacity:0.55}
</style>
</head>
<body>

<svg id="grain" width="2160" height="2700">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<div class="frame"></div>

<div class="hdr">
  <div><b>FIELD LOG</b>&nbsp;&nbsp;—&nbsp;&nbsp;SIMULTANEOUS THRESHOLDS</div>
  <div><span>SER. Θ&nbsp;&nbsp;/&nbsp;&nbsp;VOL. 02&nbsp;&nbsp;/&nbsp;&nbsp;OBS. 23.09</span></div>
</div>
<div class="hdr-rule"></div>

<div class="fineruler" id="fine1" style="top:206px"><div class="fl"></div></div>

<div class="num-wrap">
  <div class="numeral">5</div>
</div>
<div class="num-capline"></div>
<div class="num-cap">EVENTS IN THE APERTURE<br>AT TIME OF OBSERVATION — NONE RESOLVED</div>

<div class="diagram" id="diagram">
  <svg class="diag-svg" id="diag-svg" width="1900" height="760"></svg>
</div>

<div class="fineruler" id="fine2" style="top:1790px"><div class="fl"></div></div>

<div class="annot">
  <div class="annot-bar"></div>
  <div class="annot-serif">still&nbsp;moving.</div>
</div>

<div class="readout">
  <div class="readout-row"><span class="lbl">MEAN APERTURE</span><span class="val">53.4&deg;</span></div>
  <div class="readout-row"><span class="lbl">VARIANCE</span><span class="val">&plusmn;27.1&deg;</span></div>
  <div class="readout-rule"></div>
  <div class="readout-row"><span class="lbl">RESOLVED</span><span class="val">0 / 5</span></div>
  <div class="readout-row"><span class="lbl">IN MOTION</span><span class="val">5 / 5</span></div>
</div>

<div class="ftr">
  <div class="ftr-rule"></div>
  <div class="ftr-row"><span class="l">NO THRESHOLD CROSSED ALONE</span><span class="r">RECORDED, NOT RESOLVED</span></div>
</div>

<div class="ruler" id="ruler"></div>

<script>
// ---- fine ruler ticks (dense, systematic marks) ----
function fillRuler(el, n, everyMajor){
  const W = el.getBoundingClientRect().width;
  for(let i=0;i<=n;i++){
    const t = document.createElement('div');
    t.className = 'ft' + (i % everyMajor === 0 ? '' : '');
    t.style.left = (i/n*W) + 'px';
    t.style.height = (i % everyMajor === 0 ? '18px':'9px');
    t.style.marginTop = (i % everyMajor === 0 ? '-9px':'-4.5px');
    el.appendChild(t);
  }
}
fillRuler(document.getElementById('fine1'), 220, 10);
fillRuler(document.getElementById('fine2'), 220, 10);

const ruler = document.getElementById('ruler');
const RW = ruler.getBoundingClientRect().width;
for (let i=0;i<=60;i++){
  const t = document.createElement('div');
  t.className = 'rt' + (i % 5 === 0 ? ' major' : '');
  t.style.left = (i/60*RW) + 'px';
  ruler.appendChild(t);
}

// ---- door-swing threshold diagram ----
// each gate: hinge on the axis; a leaf swings from CLOSED (flush, vertical, pointing up)
// to its recorded aperture angle (measured from vertical, opening toward the left).
// a thin arc traces the swept path, the classic architectural door-swing symbol.
const gates = [
  {x: 420,  deg: 14, code:'Θ-01', color:'#FF4D2E'},
  {x: 700,  deg: 38, code:'Θ-02', color:'#FF4D2E'},
  {x: 1030, deg: 54, code:'Θ-03', color:'#3DA9FC'},
  {x: 1400, deg: 71, code:'Θ-04', color:'#3DA9FC'},
  {x: 1800, deg: 90, code:'Θ-05', color:'#1B8A5A'},
]
const AXIS_Y = 540;
const L = 380;
const svg = document.getElementById('diag-svg');
const ns = 'http://www.w3.org/2000/svg';

function mk(tag, attrs){
  const e = document.createElementNS(ns, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// the axis
svg.appendChild(mk('line', {x1:0, y1:AXIS_Y, x2:1900, y2:AXIS_Y, stroke:'#0A0A0A', 'stroke-width':2.5}));
svg.appendChild(mk('line', {x1:0, y1:AXIS_Y-8, x2:0, y2:AXIS_Y+8, stroke:'#0A0A0A', 'stroke-width':2.5}));
svg.appendChild(mk('line', {x1:1900, y1:AXIS_Y-8, x2:1900, y2:AXIS_Y+8, stroke:'#0A0A0A', 'stroke-width':2.5}));

gates.forEach(g=>{
  const rad = g.deg * Math.PI/180;
  const leafX = g.x - L*Math.sin(rad);
  const leafY = AXIS_Y - L*Math.cos(rad);
  const closedX = g.x, closedY = AXIS_Y - L;

  // faint full quadrant guide (0 to 90)
  const largeArc = 0, sweep = 1;
  const q90x = g.x - L, q90y = AXIS_Y;
  svg.appendChild(mk('path', {
    d:`M ${closedX} ${closedY} A ${L} ${L} 0 0 1 ${q90x} ${q90y}`,
    fill:'none', stroke:'#0A0A0A', 'stroke-width':1, opacity:0.10
  }));

  // swept arc up to the recorded aperture, in the gate's color
  svg.appendChild(mk('path', {
    d:`M ${closedX} ${closedY} A ${L} ${L} 0 0 1 ${leafX} ${leafY}`,
    fill:'none', stroke:g.color, 'stroke-width':2.5, opacity:0.9
  }));

  // frame post (closed reference, dashed)
  svg.appendChild(mk('line', {x1:g.x, y1:AXIS_Y, x2:closedX, y2:closedY,
    stroke:'#0A0A0A', 'stroke-width':1.5, 'stroke-dasharray':'2 10', opacity:0.35}));

  // the leaf itself
  svg.appendChild(mk('line', {x1:g.x, y1:AXIS_Y, x2:leafX, y2:leafY,
    stroke:'#0A0A0A', 'stroke-width':4}));
  svg.appendChild(mk('line', {x1:g.x, y1:AXIS_Y, x2:leafX, y2:leafY,
    stroke:g.color, 'stroke-width':4, opacity:0.001})); // keep for potential future tint

  // leaf tip marker
  svg.appendChild(mk('circle', {cx:leafX, cy:leafY, r:7, fill:g.color, stroke:'#0A0A0A', 'stroke-width':2}));

  // hinge
  svg.appendChild(mk('circle', {cx:g.x, cy:AXIS_Y, r:6.5, fill:'#0A0A0A'}));

  // label
  const lbl = document.createElement('div');
  lbl.className = 'gtick';
  lbl.style.left = (g.x/1900*100) + '%';
  lbl.innerHTML = `<span class="code">${g.code}</span><span class="deg">${g.deg}&deg; OPEN</span>`;
  document.getElementById('diagram').appendChild(lbl);
});
</script>

</body>
</html>
