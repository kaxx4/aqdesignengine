<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -170 1260 810" width="1260" height="810">
  <defs>
    <linearGradient id="satin" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FF5468"/>
      <stop offset=".38" stop-color="#E0142E"/>
      <stop offset=".78" stop-color="#9A0A1C"/>
      <stop offset="1" stop-color="#5E0411"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0B0"/>
      <stop offset=".45" stop-color="#E8B23A"/>
      <stop offset="1" stop-color="#9C6A12"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8E0A1B"/>
      <stop offset=".6" stop-color="#E5182F"/>
      <stop offset="1" stop-color="#FF7A86"/>
    </linearGradient>
    <radialGradient id="gem" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFE9EC"/>
      <stop offset=".35" stop-color="#FF5468"/>
      <stop offset="1" stop-color="#6E0612"/>
    </radialGradient>
    <clipPath id="body">
      <path id="outline" d="M40 250 C90 160 220 112 330 150 C400 175 452 150 500 92 C548 150 600 175 670 150 C780 112 910 160 960 250 C930 330 880 440 780 470 C700 492 600 424 500 402 C400 424 300 492 220 470 C120 440 70 330 40 250 Z"/>
    </clipPath>
  </defs>

  <!-- plume: three feathers fanning off the right wing, behind the mask -->
  <g transform="translate(900 200)">
    <g transform="rotate(14) scale(.9)"><path d="M0 0 C34 -110 100 -250 190 -360 C150 -230 92 -110 0 0 Z" fill="url(#plume)"/><path d="M0 0 C60 -120 120 -240 190 -360" stroke="#F3C969" stroke-width="3" fill="none"/></g>
    <g transform="rotate(38) scale(.82)"><path d="M0 0 C34 -110 100 -250 190 -360 C150 -230 92 -110 0 0 Z" fill="url(#plume)"/><path d="M0 0 C60 -120 120 -240 190 -360" stroke="#F3C969" stroke-width="3" fill="none"/></g>
    <g transform="rotate(-6) scale(.7)"><path d="M0 0 C34 -110 100 -250 190 -360 C150 -230 92 -110 0 0 Z" fill="url(#plume)"/><path d="M0 0 C60 -120 120 -240 190 -360" stroke="#F3C969" stroke-width="3" fill="none"/></g>
  </g>

  <!-- body: red satin with the eye openings cut out (evenodd), so the ground shows through -->
  <path fill="url(#satin)" fill-rule="evenodd"
        d="M40 250 C90 160 220 112 330 150 C400 175 452 150 500 92 C548 150 600 175 670 150 C780 112 910 160 960 250 C930 330 880 440 780 470 C700 492 600 424 500 402 C400 424 300 492 220 470 C120 440 70 330 40 250 Z
           M142 292 C196 232 330 236 424 306 C352 366 226 370 142 292 Z
           M858 292 C804 232 670 236 576 306 C648 366 774 370 858 292 Z"/>

  <!-- satin sheen: two soft light bands across the brow and cheek, clipped to the body -->
  <g clip-path="url(#body)">
    <path d="M60 230 C240 120 420 170 520 130 C440 200 250 190 60 270 Z" fill="url(#sheen)" opacity=".9"/>
    <path d="M520 130 C700 170 860 120 980 240 C860 200 700 230 520 160 Z" fill="url(#sheen)" opacity=".5"/>
    <path d="M300 470 C480 430 640 470 820 420 C700 490 480 500 300 470 Z" fill="#000" opacity=".22"/>
  </g>

  <!-- filigree: gold swirls over the brow and temples -->
  <g fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
    <path d="M500 118 C500 175 470 215 430 238 C396 256 366 240 372 214 C378 192 408 192 412 214"/>
    <path d="M500 118 C500 175 530 215 570 238 C604 256 634 240 628 214 C622 192 592 192 588 214"/>
    <path d="M110 262 C130 206 196 176 262 190 C316 202 330 252 296 266 C268 276 254 244 276 236"/>
    <path d="M890 262 C870 206 804 176 738 190 C684 202 670 252 704 266 C732 276 746 244 724 236"/>
    <path d="M470 420 C440 400 396 418 374 446 M530 420 C560 400 604 418 626 446"/>
  </g>

  <!-- gold edge + beaded trim along the outline and round both eyes -->
  <path d="M40 250 C90 160 220 112 330 150 C400 175 452 150 500 92 C548 150 600 175 670 150 C780 112 910 160 960 250 C930 330 880 440 780 470 C700 492 600 424 500 402 C400 424 300 492 220 470 C120 440 70 330 40 250 Z"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M40 250 C90 160 220 112 330 150 C400 175 452 150 500 92 C548 150 600 175 670 150 C780 112 910 160 960 250 C930 330 880 440 780 470 C700 492 600 424 500 402 C400 424 300 492 220 470 C120 440 70 330 40 250 Z"
        fill="none" stroke="#FFF3CF" stroke-width="7" stroke-dasharray="0 17" stroke-linecap="round" transform="translate(500 290) scale(.965) translate(-500 -290)"/>
  <g fill="none" stroke="url(#gold)" stroke-width="6">
    <path d="M142 292 C196 232 330 236 424 306 C352 366 226 370 142 292 Z"/>
    <path d="M858 292 C804 232 670 236 576 306 C648 366 774 370 858 292 Z"/>
  </g>
  <g fill="none" stroke="#FFF3CF" stroke-width="6" stroke-dasharray="0 15" stroke-linecap="round">
    <path d="M142 292 C196 232 330 236 424 306 C352 366 226 370 142 292 Z" transform="translate(283 300) scale(1.1) translate(-283 -300)"/>
    <path d="M858 292 C804 232 670 236 576 306 C648 366 774 370 858 292 Z" transform="translate(717 300) scale(1.1) translate(-717 -300)"/>
  </g>

  <!-- gems: a brow stone, wing stones, and a tiny gold star at each temple -->
  <g>
    <circle cx="500" cy="196" r="22" fill="url(#gem)" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="116" cy="270" r="13" fill="url(#gem)" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="884" cy="270" r="13" fill="url(#gem)" stroke="url(#gold)" stroke-width="4"/>
    <path d="M250 205 l7 17 18 2 -14 12 5 18 -16 -10 -16 10 5 -18 -14 -12 18 -2 z" fill="url(#gold)"/>
    <path d="M750 205 l7 17 18 2 -14 12 5 18 -16 -10 -16 10 5 -18 -14 -12 18 -2 z" fill="url(#gold)"/>
  </g>
</svg>
